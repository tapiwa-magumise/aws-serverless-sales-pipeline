# Checks skipped on purpose. Each one either needs a paid feature this
# zero-cost demo avoids, or does not apply to this design. See docs/decisions.md.
skip-check:
  - CKV_AWS_338  # 1-year log retention: 14 days is enough here and keeps storage free
  - CKV_AWS_158  # CloudWatch logs with a customer-managed KMS key: monthly key charge; logs are encrypted by default
  - CKV_AWS_119  # DynamoDB customer-managed KMS key: monthly key charge; table is encrypted with an AWS-owned key
  - CKV_AWS_28   # DynamoDB point-in-time recovery: billed; the audit table can be rebuilt from S3
  - CKV_AWS_173  # Lambda env vars with a customer-managed key: env holds no secrets, only names
  - CKV_AWS_117  # Lambda in a VPC: no private resources to reach; a VPC would need paid NAT or endpoints
  - CKV_AWS_116  # Lambda DLQ: only applies to async invokes; the SQS queue already has a DLQ
  - CKV_AWS_115  # Reserved concurrency: capped instead with SQS maximum_concurrency = 2
  - CKV_AWS_272  # Lambda code signing: code only reaches AWS through the reviewed CI pipeline
